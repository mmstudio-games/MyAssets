<!DOCTYPE html>
<!-- 边界场景 C：纯渐变圆角按钮，无高光/无边框线/无文字干扰 → 测试 lineTop 是否误判 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; width: 100%; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; }
  .btn {
    background: linear-gradient(180deg, #ff9a9e 0%, #fad0c4 100%);
    border-radius: 24px;   /* 圆角 24px CSS = 48px 物理 @2x */
    padding: 40px 80px;
  }
</style>
</head>
<body>
  <div class="btn"></div>
</body>
</html>
