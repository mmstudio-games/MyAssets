<!DOCTYPE html>
<!-- 主菜单界面（多资产编排演示）：标题光晕 + 开始按钮 + 装饰条
     export 命令按 scene.yaml 的 assets 声明一次导出整套 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; width: 100%; height: 100%; }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 40px;
  }
  .title-glow {
    width: 520px; height: 140px;
    background: radial-gradient(ellipse at center,
      rgba(255, 215, 100, 0.9) 0%,
      rgba(255, 170, 50, 0.4) 55%,
      transparent 100%);
    filter: blur(4px);
  }
  .start-btn {
    font-family: system-ui, sans-serif;
    font-size: 34px; font-weight: 700; color: #6b3f00;
    letter-spacing: 8px;
    padding: 18px 64px;
    border: none;
    border-radius: 18px;
    background: linear-gradient(180deg, #ffe9a8 0%, #ffd25e 45%, #f5a623 100%);
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,0.7),
      inset 0 -4px 0 rgba(160,90,0,0.3),
      0 6px 16px rgba(0,0,0,0.4);
  }
  .deco-bar {
    width: 360px; height: 16px;
    background: linear-gradient(90deg, transparent, #ffd25e 30%, #fff3c4 50%, #ffd25e 70%, transparent);
    border-radius: 8px;
    opacity: 0.8;
  }
</style>
</head>
<body>
  <div class="title-glow"></div>
  <button class="start-btn">开始游戏</button>
  <div class="deco-bar"></div>
</body>
</html>
