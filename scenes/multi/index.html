<!DOCTYPE html>
<!-- 边界场景 D：多按钮页面，scene.yaml 用 slices.target 指定切图目标 -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; width: 100%; height: 100%; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 60px; }
  .btn-a {
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg, #4fc3f7 0%, #0288d1 100%);
    border-radius: 16px;
    padding: 20px 60px;
    color: #fff;
    font-size: 30px;
    font-weight: 700;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
  }
  .btn-b {
    font-family: system-ui, sans-serif;
    background: linear-gradient(180deg, #ff8a65 0%, #d84315 100%);
    border-radius: 8px;
    border: 3px solid #7c2d12;
    padding: 14px 40px;
    color: #fff;
    font-size: 24px;
    font-weight: 700;
  }
</style>
</head>
<body>
  <button class="btn-a">开始游戏</button>
  <button class="btn-b">返回</button>
</body>
</html>
