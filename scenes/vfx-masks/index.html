<!DOCTYPE html>
<!-- 程序化贴图：技能图标光晕底 + 按钮按下遮罩
     光晕底：径向渐变透明贴图；遮罩：半透明黑 + 圆角（九宫格可拉伸） -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; width: 100%; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; gap: 80px; }

  /* 技能图标光晕底（游戏里图标下方的彩色光圈） */
  .icon-glow {
    width: 256px;
    height: 256px;
    background: radial-gradient(circle,
      rgba(90, 220, 255, 0.9) 0%,
      rgba(60, 160, 255, 0.5) 35%,
      rgba(40, 100, 255, 0.18) 65%,
      transparent 100%);
    border-radius: 50%;
  }

  /* 按钮按下遮罩（按压反馈，九宫格） */
  .press-mask {
    width: 300px;
    height: 120px;
    background: rgba(0, 0, 0, 0.45);
    border-radius: 24px;
    box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.5);
  }
</style>
</head>
<body>
  <div class="icon-glow"></div>
  <div class="press-mask"></div>
</body>
</html>
